<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pune City Sightseeing Guide</title>
<meta name="description" content="A swipeable pocket guide to Pune's historic Peths, wadas and Ganpati temples.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <div id="track">

    <!-- SLIDE 1 : INTRO -->
    <section class="slide slide-intro" data-kind="intro">
      <div class="intro-bg" id="introBg"></div>
      <div class="intro-overlay"></div>
      <div class="intro-content">
        <div class="intro-motif" aria-hidden="true">✦</div>
        <h1 class="intro-title">पुणे<span class="intro-title-en">Pune</span></h1>
        <p class="intro-subtitle">A Walking Guide to the Old City</p>
        <p class="intro-tagline">Peshwa capital · Cultural heart of Maharashtra</p>
        <div class="intro-hint">
          <span class="hint-arrow">‹</span>
          <span>swipe to begin</span>
          <span class="hint-arrow">›</span>
        </div>
      </div>
    </section>

    <!-- SLIDE 2 : ABOUT PUNE -->
    <section class="slide slide-about" data-kind="about">
      <header class="slide-header">
        <span class="slide-eyebrow">About the City</span>
        <div class="about-header-row">
          <h2>Pune, Through the Centuries</h2>
          <button class="audio-btn" type="button" data-audio-source="about" aria-label="Read this slide aloud">
            <span class="audio-icon">🔊</span><span class="audio-text">Listen</span>
          </button>
        </div>
      </header>
      <div class="about-scroll" id="aboutContent">
        <p class="about-loading">Loading Pune's history…</p>
      </div>
    </section>

    <!-- SLIDE 3 : INDEX -->
    <section class="slide slide-index" data-kind="index">
      <header class="slide-header">
        <span class="slide-eyebrow">The Guide</span>
        <h2>All Sights</h2>
        <p class="index-hint">Tap a place to jump straight there</p>
      </header>
      <ol class="index-list" id="indexList">
        <li class="index-loading">Loading sights…</li>
      </ol>
    </section>

    <!-- SIGHT SLIDES injected here by js/app.js -->

  </div>

  <!-- Persistent chrome -->
  <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous slide">‹</button>
  <button class="nav-btn nav-next" id="nextBtn" aria-label="Next slide">›</button>
  <div class="progress-dots" id="progressDots"></div>
  <div class="slide-counter" id="slideCounter"></div>

</div>

<script src="data/about-pune.js"></script>
<script src="data/sights-batch-a.js"></script>
<script src="data/sights-batch-b.js"></script>
<script src="data/sights-batch-c.js"></script>
<script src="js/app.js"></script>
</body>
</html>
